<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineBook · movie tickets</title>
  <!-- Font Awesome 6 (free) for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #0b0f1c 0%, #141b2b 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    /* main card */
    .booking-platform {
      max-width: 1300px;
      width: 100%;
      background: rgba(18, 25, 40, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 2.5rem;
      padding: 2rem 2rem 1.8rem;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .logo i {
      font-size: 2.5rem;
      color: #f5c542;
      filter: drop-shadow(0 0 10px rgba(245, 197, 66, 0.5));
    }

    .logo h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #d9e2f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo span {
      font-size: 0.9rem;
      font-weight: 400;
      color: #9aa8c0;
      margin-left: 0.2rem;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      background: rgba(255, 255, 255, 0.04);
      padding: 0.5rem 1.2rem 0.5rem 0.9rem;
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .user-profile i {
      font-size: 1.3rem;
      color: #b7c3d9;
      transition: color 0.2s;
    }

    .user-profile i:hover {
      color: #f5c542;
    }

    .avatar {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #2e3b52, #1b2333);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #f5c542;
      color: #f5c542;
      font-weight: 600;
      font-size: 1rem;
    }

    /* search + filter bar */
    .search-section {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 2;
      min-width: 260px;
      display: flex;
      align-items: center;
      background: #1e273b;
      border-radius: 60px;
      padding: 0.1rem 0.1rem 0.1rem 1.5rem;
      border: 1px solid #2e3b52;
      transition: all 0.2s;
    }

    .search-box:focus-within {
      border-color: #f5c542;
      box-shadow: 0 0 0 3px rgba(245, 197, 66, 0.2);
    }

    .search-box i {
      color: #7e8aa3;
      font-size: 1.1rem;
    }

    .search-box input {
      width: 100%;
      background: transparent;
      border: none;
      padding: 0.9rem 1rem;
      color: #f0f4fe;
      font-size: 1rem;
      outline: none;
    }

    .search-box input::placeholder {
      color: #5d6a83;
      font-weight: 400;
    }

    .search-box button {
      background: #f5c542;
      border: none;
      border-radius: 60px;
      padding: 0.8rem 1.8rem;
      font-weight: 600;
      color: #0b0f1c;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      font-size: 0.95rem;
      letter-spacing: 0.2px;
    }

    .search-box button:hover {
      background: #ffd95c;
      transform: scale(1.02);
    }

    .filter-badge {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: #1e273b;
      border-radius: 60px;
      padding: 0.2rem 0.2rem 0.2rem 1.2rem;
      border: 1px solid #2e3b52;
    }

    .filter-badge span {
      color: #b7c3d9;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .filter-badge select {
      background: #131b2b;
      color: #f0f4fe;
      border: 1px solid #2e3b52;
      border-radius: 60px;
      padding: 0.7rem 1rem;
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
      font-weight: 500;
    }

    .filter-badge select:hover {
      border-color: #f5c542;
    }

    /* movie grid */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.6rem;
      margin-bottom: 2.5rem;
    }

    .movie-card {
      background: #131b2b;
      border-radius: 1.8rem;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      border: 1px solid #26304a;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
    }

    .movie-card:hover {
      transform: translateY(-6px);
      border-color: #f5c542;
      box-shadow: 0 18px 30px -8px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(245, 197, 66, 0.3);
    }

    .poster {
      height: 260px;
      background-size: cover;
      background-position: center;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      padding: 0.6rem;
    }

    /* poster gradients (instead of external images) */
    .poster-1 { background: linear-gradient(135deg, #1f2a3f, #0f1422), radial-gradient(circle at 30% 40%, #4b3b1f, #0f1422); background-blend-mode: overlay; }
    .poster-2 { background: linear-gradient(135deg, #1a2a3a, #0e1622), radial-gradient(circle at 70% 30%, #3b2e4b, #0e1622); background-blend-mode: overlay; }
    .poster-3 { background: linear-gradient(135deg, #232b3b, #141c28), radial-gradient(circle at 40% 60%, #2c4a4a, #141c28); background-blend-mode: overlay; }
    .poster-4 { background: linear-gradient(135deg, #2a1f2f, #1a1220), radial-gradient(circle at 60% 20%, #553b3b, #1a1220); background-blend-mode: overlay; }

    .rating {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      border-radius: 30px;
      padding: 0.3rem 0.9rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #f5c542;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      border: 1px solid rgba(245, 197, 66, 0.4);
    }

    .rating i {
      font-size: 0.75rem;
    }

    .movie-info {
      padding: 1.2rem 1rem 1.2rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .movie-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.3rem;
      letter-spacing: -0.3px;
      line-height: 1.3;
    }

    .movie-meta {
      display: flex;
      gap: 0.8rem;
      font-size: 0.8rem;
      color: #8b99b3;
      margin-bottom: 1rem;
      font-weight: 500;
    }

    .movie-meta i {
      font-size: 0.7rem;
      margin-right: 0.2rem;
      color: #f5c542;
    }

    .showtimes {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1rem;
      margin-top: auto;
    }

    .time-badge {
      background: #1f293f;
      padding: 0.45rem 0.9rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #d0dbf0;
      border: 1px solid #2d3a55;
      transition: all 0.15s;
      cursor: default;
    }

    .time-badge:hover {
      background: #2d3a55;
      border-color: #f5c542;
      color: #ffffff;
    }

    .book-btn {
      background: transparent;
      border: 1.5px solid #f5c542;
      color: #f5c542;
      font-weight: 700;
      padding: 0.8rem 1rem;
      border-radius: 60px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      letter-spacing: 0.3px;
      width: 100%;
    }

    .book-btn i {
      font-size: 0.9rem;
    }

    .book-btn:hover {
      background: #f5c542;
      color: #0b0f1c;
      border-color: #f5c542;
      box-shadow: 0 6px 14px rgba(245, 197, 66, 0.3);
    }

    /* booking summary / footer */
    .booking-footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: #101827;
      border-radius: 2rem;
      padding: 1rem 1.8rem;
      border: 1px solid #26304a;
      gap: 1rem;
    }

    .selected-info {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .selected-info p {
      color: #b7c3d9;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .selected-info i {
      color: #f5c542;
      font-size: 1.1rem;
    }

    .badge-count {
      background: #f5c542;
      color: #0b0f1c;
      font-weight: 700;
      border-radius: 30px;
      padding: 0.25rem 0.9rem;
      font-size: 0.9rem;
      margin-left: 0.4rem;
    }

    .checkout-btn {
      background: #f5c542;
      border: none;
      border-radius: 60px;
      padding: 0.9rem 2rem;
      font-weight: 700;
      font-size: 1rem;
      color: #0b0f1c;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }

    .checkout-btn:hover {
      background: #ffda5e;
      transform: scale(1.02);
      box-shadow: 0 8px 18px rgba(245, 197, 66, 0.4);
    }

    .checkout-btn i {
      font-size: 1rem;
    }

    /* responsive */
    @media (max-width: 700px) {
      .booking-platform {
        padding: 1.5rem 1rem;
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .search-section {
        flex-direction: column;
        align-items: stretch;
      }

      .filter-badge {
        justify-content: space-between;
      }

      .booking-footer {
        flex-direction: column;
        align-items: stretch;
      }

      .selected-info {
        justify-content: space-between;
      }

      .checkout-btn {
        justify-content: center;
      }

      .poster {
        height: 200px;
      }
    }

    @media (max-width: 450px) {
      .movie-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="booking-platform">
    <!-- header -->
    <div class="header">
      <div class="logo">
        <i class="fas fa-film"></i>
        <div>
          <h1>CineBook <span>tickets</span></h1>
        </div>
      </div>
      <div class="user-profile">
        <i class="fas fa-bell"></i>
        <i class="fas fa-cog"></i>
        <div class="avatar">JD</div>
      </div>
    </div>

    <!-- search & filter -->
    <div class="search-section">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Search movies, cinemas, or genres...">
        <button>Search</button>
      </div>
      <div class="filter-badge">
        <span><i class="fas fa-sliders-h" style="margin-right: 6px;"></i>Genre</span>
        <select>
          <option>All</option>
          <option>Action</option>
          <option>Sci-Fi</option>
          <option>Drama</option>
          <option>Comedy</option>
        </select>
      </div>
    </div>

    <!-- movie grid -->
    <div class="movie-grid">
      <!-- movie 1 -->
      <div class="movie-card">
        <div class="poster poster-1">
          <div class="rating"><i class="fas fa-star"></i> 8.7</div>
        </div>
        <div class="movie-info">
          <div class="movie-title">Dune: Part Two</div>
          <div class="movie-meta">
            <span><i class="far fa-clock"></i> 166 min</span>
            <span><i class="fas fa-tag"></i> Sci-Fi</span>
          </div>
          <div class="showtimes">
            <span class="time-badge">10:30 AM</span>
            <span class="time-badge">2:15 PM</span>
            <span class="time-badge">6:00 PM</span>
          </div>
          <button class="book-btn"><i class="fas fa-ticket-alt"></i> Book now</button>
        </div>
      </div>

      <!-- movie 2 -->
      <div class="movie-card">
        <div class="poster poster-2">
          <div class="rating"><i class="fas fa-star"></i> 7.9</div>
        </div>
        <div class="movie-info">
          <div class="movie-title">Oppenheimer</div>
          <div class="movie-meta">
            <span><i class="far fa-clock"></i> 180 min</span>
            <span><i class="fas fa-tag"></i> Drama</span>
          </div>
          <div class="showtimes">
            <span class="time-badge">11:00 AM</span>
            <span class="time-badge">3:30 PM</span>
            <span class="time-badge">7:45 PM</span>
          </div>
          <button class="book-btn"><i class="fas fa-ticket-alt"></i> Book now</button>
        </div>
      </div>

      <!-- movie 3 -->
      <div class="movie-card">
        <div class="poster poster-3">
          <div class="rating"><i class="fas fa-star"></i> 8.2</div>
        </div>
        <div class="movie-info">
          <div class="movie-title">The Batman</div>
          <div class="movie-meta">
            <span><i class="far fa-clock"></i> 176 min</span>
            <span><i class="fas fa-tag"></i> Action</span>
          </div>
          <div class="showtimes">
            <span class="time-badge">12:20 PM</span>
            <span class="time-badge">4:45 PM</span>
            <span class="time-badge">9:00 PM</span>
          </div>
          <button class="book-btn"><i class="fas fa-ticket-alt"></i> Book now</button>
        </div>
      </div>

      <!-- movie 4 -->
      <div class="movie-card">
        <div class="poster poster-4">
          <div class="rating"><i class="fas fa-star"></i> 7.5</div>
        </div>
        <div class="movie-info">
          <div class="movie-title">Poor Things</div>
          <div class="movie-meta">
            <span><i class="far fa-clock"></i> 141 min</span>
            <span><i class="fas fa-tag"></i> Comedy</span>
          </div>
          <div class="showtimes">
            <span class="time-badge">1:00 PM</span>
            <span class="time-badge">5:20 PM</span>
            <span class="time-badge">8:30 PM</span>
          </div>
          <button class="book-btn"><i class="fas fa-ticket-alt"></i> Book now</button>
        </div>
      </div>
    </div>

    <!-- booking / summary footer -->
    <div class="booking-footer">
      <div class="selected-info">
        <p><i class="fas fa-chair"></i> Seats selected <span class="badge-count">2</span></p>
        <p><i class="fas fa-clock"></i> Today, 6:00 PM</p>
      </div>
      <button class="checkout-btn">
        <i class="fas fa-credit-card"></i> Checkout · $24.50
      </button>
    </div>
  </div>
</body>
</html>
